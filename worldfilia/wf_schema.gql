  modified: DateTime!
  name: String!
  path: String!
  url: String!
}

input CampaignWhereInput {
  AND: [CampaignWhereInput!]
  categories: StringFilter
  created: DateTimeFilter
  description: StringFilter
  extra: StringFilter
  extra_images: StringFilter
  id: IntFilter
  modified: DateTimeFilter
  name: StringFilter
  NOT: [CampaignWhereInput!]
  OR: [CampaignWhereInput!]
  payment_times: StringFilter
  ranking_value: FloatFilter
  status: StringFilter
}

input CampaignWhereUniqueInput {
  id: Int
}

type Performance {
  commissions: Float
  cr: Float
  epc: Float
  from: String
  periods: [JSON]
  rawClicks: Int
  sales: Int
  pendingSales: Int
  rejectedSales: Int
  splitType: Int
  to: String
  uniqueClicks: Int
}

type Query {
  readCampaigns(
    cursor: CampaignWhereUniqueInput
    orderBy: [CampaignOrderByInput!]
    skip: Int
    take: Int
    token: String!
    where: CampaignWhereInput
  ): [Campaign]
  readLinks(
    cursor: UserLinkWhereUniqueInput
    orderBy: [UserLinkOrderByInput!]
    skip: Int
    take: Int
    token: String!
    where: UserLinkWhereInput
  ): [UserLink]
  readStats(filter: JSON, groupBy: JSON, token: String!): Performance
}
