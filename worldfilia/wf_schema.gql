type Landing {
  Campaign: Campaign!
  campaign_id: Int!
  created: DateTime!
  id: Int!
  modified: DateTime!
  name: String!
  status: String!
  type: String!
  url: String!
}

type UserLink {
  Campaign: Campaign!
  campaign_id: Int!
  created: DateTime!
  facebook_contact_page: String!
  id: Int!
  Landing: Landing
  landing_id: Int
  modified: DateTime!
  publisher_domains: String!
  social_caption: String!
  social_image_file: String!
  social_image_url: String!
  social_title: String!
  subid1: String!
  subid2: String!
  userId: Int!
}

input UserLinkWhereInput {
  AND: [UserLinkWhereInput!]
  Campaign: CampaignWhereInput
  campaign_id: IntFilter
  created: DateTimeFilter
  facebook_contact_page: StringFilter
  id: IntFilter
  Landing: LandingWhereInput
  landing_id: IntNullableFilter
  modified: DateTimeFilter
  NOT: [UserLinkWhereInput!]
  OR: [UserLinkWhereInput!]
  publisher_domains: StringFilter
  social_caption: StringFilter
  social_image_file: StringFilter
  social_image_url: StringFilter
  social_title: StringFilter
  subid1: StringFilter
  subid2: StringFilter
  userId: IntFilter
}

input UserLinkWhereUniqueInput {
  id: Int
}

input UserLinkOrderByInput {
  campaign_id: SortOrder
  created: SortOrder
  facebook_contact_page: SortOrder
  id: SortOrder
  landing_id: SortOrder
  modified: SortOrder
  publisher_domains: SortOrder
  social_caption: SortOrder
  social_image_file: SortOrder
  social_image_url: SortOrder
  social_title: SortOrder
  subid1: SortOrder
  subid2: SortOrder
  userId: SortOrder
}

input LandingWhereInput {
  AND: [LandingWhereInput!]
  Campaign: CampaignWhereInput
  campaign_id: IntFilter
  created: DateTimeFilter
  id: IntFilter
  modified: DateTimeFilter
  name: StringFilter
  NOT: [LandingWhereInput!]
  OR: [LandingWhereInput!]
  status: StringFilter
  type: StringFilter
  url: StringFilter
}

type Campaign {
  CampaignVideo: [CampaignVideo!]!
  categories: String!
  created: DateTime!
  description: String!
  extra: String!
  extra_images: String!
  id: Int!
  images: [String]
  Landing: [Landing!]!
  logoUrl: String
  modified: DateTime!
  name: String!
  payment_times: String!
  ranking_value: Float!
  status: String!
}

type CampaignCommission {
  amount: Float
  campaign_id: Int!
  country: String!
  created: DateTime
  currency: String!
  id: Int!
  modified: DateTime
  name: String!
  priority: Int!
  type: String!
}

input CampaignOrderByInput {
  categories: SortOrder
  created: SortOrder
  description: SortOrder
  id: SortOrder
  modified: SortOrder
  name: SortOrder
  payment_times: SortOrder
  ranking_value: SortOrder
  status: SortOrder
}

type CampaignVideo {
